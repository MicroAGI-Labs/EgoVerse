# Local single-episode MicroAGI keypoints data config (CPU smoke test).
# Loads the post-fragment-to-egoverse output zarr via LocalEpisodeResolver
# (no S3), using the Microagi embodiment keymap + wrist-frame keypoint transforms.
_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

train_datasets:
  microagi_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolver
      folder_path: /home/marcopoggensee/post-fragment-to-egoverse/output_microagi
      key_map:
        _target_: egomimic.rldb.embodiment.human.Microagi.get_keymap
        keymap_mode: keypoints
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Microagi.get_transform_list
        mode: keypoints_wristframe_ypr
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
        - "lambda row: row['episode_hash'] == '2026-05-11-06-27-24-760000'"
    sync_from_s3: false
    mode: total

valid_datasets:
  microagi_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolver
      folder_path: /home/marcopoggensee/post-fragment-to-egoverse/output_microagi
      key_map:
        _target_: egomimic.rldb.embodiment.human.Microagi.get_keymap
        keymap_mode: keypoints
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Microagi.get_transform_list
        mode: keypoints_wristframe_ypr
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
        - "lambda row: row['episode_hash'] == '2026-05-11-06-27-24-760000'"
    sync_from_s3: false
    mode: total

train_dataloader_params:
  microagi_bimanual:
    batch_size: 2
    num_workers: 0
valid_dataloader_params:
  microagi_bimanual:
    batch_size: 2
    num_workers: 0
